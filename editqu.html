<!DOCTYPE html>
<html>
    <head>
        <title>Edit Quotes - SYQ</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body { margin: 0; padding: 15px; font-family: 'Times New Roman', Times, serif; background-color: #fafafa; }
            .item-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; background-color: #f9f9f9; gap: 10px; }
            .item-card p { margin: 0; font-size: 18px; word-break: break-word; }
            .trash-icon { width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; }
            .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000; }
            .popup-box { border-style: solid; padding: 25px; width: 80%; max-width: 280px; text-align: center; border-radius: 8px; border-width: 2px; background-color: rgb(249, 249, 249); font-family: 'Times New Roman', Times, serif; box-sizing: border-box; }
            .popup-box p { margin-top: 0; margin-bottom: 20px; font-size: 16px; }
            .btn-group { display: flex; justify-content: center; gap: 20px; text-align: center; }
            .tik { background-color: rgb(243, 243, 243); border-radius: 4px; border-width: 0.5px; cursor: pointer; padding: 5px 15px; font-family: 'Times New Roman', Times, serif; }
            .tik:hover { background-color: rgb(222, 222, 222); }
        </style>
    </head>
    <body>
        <h1>EDIT MY QUOTES</h1>
        <hr><br>
        <div id="listContainer"></div>

        <div id="deleteConfirmModal" class="modal-overlay">
            <div class="popup-box">
                <p>Do you want to delete this quote?</p>
                <div class="btn-group">
                    <button id="confirmDeleteBtn" class="tik">Yes</button>
                    <button class="tik" onclick="closeDeleteModal()">No</button>
                </div>
            </div>
        </div>

        <script>
            const API_BASE_URL = 'https://share-your-quotes.onrender.com';
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            let selectedQuoteId = null;

            async function loadMyQuotes() {
                if (!currentUser) return;
                try {
                    const res = await fetch(`${API_BASE_URL}/api/user-quotes/${currentUser.id}`);
                    const quotes = await res.json();
                    const container = document.getElementById('listContainer');
                    container.innerHTML = '';

                    if (!quotes || !Array.isArray(quotes) || quotes.length === 0) { container.innerHTML = '<p>Share a quote first.</p>'; return; }

                    quotes.forEach(q => {
                        container.innerHTML += `
                            <div class="item-card">
                                <p>${q.content}</p>
                                <img class="trash-icon" src="delete.png" alt="Delete" title="Delete Quote" onclick="openDeleteModal(${q.id})">
                            </div>
                        `;
                    });
                } catch (err) { console.error(err); }
            }

            function openDeleteModal(quoteId) {
                selectedQuoteId = quoteId;
                document.getElementById('deleteConfirmModal').style.display = 'flex';
            }

            function closeDeleteModal() {
                selectedQuoteId = null;
                document.getElementById('deleteConfirmModal').style.display = 'none';
            }

            document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
                if (!selectedQuoteId) return;
                const token = localStorage.getItem('authToken');
                try {
                    const res = await fetch(`${API_BASE_URL}/api/quotes/${selectedQuoteId}`, {
                        method: 'DELETE',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (res.ok) {
                        closeDeleteModal();
                        loadMyQuotes();
                    }
                } catch (err) { console.error(err); }
            });

            window.addEventListener('DOMContentLoaded', loadMyQuotes);
        </script>
    </body>
</html>
