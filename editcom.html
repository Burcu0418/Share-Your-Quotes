<!DOCTYPE html>
<html>
    <head>
        <title>Edit Comments - SYQ</title>
        <link rel="icon" type="image/x-icon" href="favicon-16x16.png">
        <style>
            body { 
                margin: 0; 
                padding: 15px; 
                font-family: 'Times New Roman', Times, serif; 
                background-color: #fafafa;
            }
            .item-card { 
                border: 1px solid #ccc; 
                padding: 15px; 
                margin-bottom: 10px; 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                border-radius: 8px; 
                background-color: #f9f9f9; 
            }
            .item-card p {
                margin: 0;
                font-size: 18px;
            }
            .item-card small {
                color: #666;
                font-size: 14px;
                display: block;
                margin-top: 4px;
            }
            .trash-icon { 
                width: 22px; 
                height: 22px; 
                cursor: pointer; 
            }

            .modal-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }

            .popup-box {
                border-style: solid;
                padding: 25px;
                width: 220px;
                text-align: center;
                border-radius: 8px;
                border-width: 2px;
                background-color: rgb(249, 249, 249);
                font-family: 'Times New Roman', Times, serif;
            }

            .popup-box p {
                margin-top: 0;
                margin-bottom: 20px;
                font-size: 16px;
            }

            .btn-group {
                display: flex;
                justify-content: center;
                gap: 30px;
                text-align: center;
            }

            .tik {
                background-color: rgb(243, 243, 243);
                border-radius: 4px;
                border-width: 0.5px;
                cursor: pointer;
                padding: 5px 15px;
                font-family: 'Times New Roman', Times, serif;
            }

            .tik:hover {
                background-color: rgb(222, 222, 222);
            }
        </style>
    </head>
    <body>
        <h1>EDIT MY COMMENTS</h1>
        <hr><br>
        <div id="listContainer"></div>

        <div id="deleteConfirmModal" class="modal-overlay">
            <div class="popup-box">
                <p>Do you want to delete this comment?</p>
                <div class="btn-group">
                    <button id="confirmDeleteBtn" class="tik">Yes</button>
                    <button class="tik" onclick="closeDeleteModal()">No</button>
                </div>
            </div>
        </div>

        <script>
            const API_BASE_URL = 'https://share-your-quotes.onrender.com';
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            let selectedCommentId = null;

            async function loadMyComments() {
                if (!currentUser) return;
                try {
                    const res = await fetch(`${API_BASE_URL}/api/user-comments/${currentUser.id}`);
                    const comments = await res.json();
                    const container = document.getElementById('listContainer');
                    container.innerHTML = '';

                    if (!comments || comments.length === 0) { 
                        container.innerHTML = '<p>Leave a comment first.</p>'; 
                        return; 
                    }

                    comments.forEach(c => {
                        container.innerHTML += `
                            <div class="item-card">
                                <div>
                                    <p>${c.comment_content}</p>
                                    <small>On Quote: "${c.quote_content}"</small>
                                </div>
                                <img class="trash-icon" src="delete.png" alt="Delete" title="Delete Comment" onclick="openDeleteModal(${c.comment_id})">
                            </div>
                        `;
                    });
                } catch (err) { console.error(err); }
            }

            function openDeleteModal(commentId) {
                selectedCommentId = commentId;
                document.getElementById('deleteConfirmModal').style.display = 'flex';
            }

            function closeDeleteModal() {
                selectedCommentId = null;
                document.getElementById('deleteConfirmModal').style.display = 'none';
            }

            document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
                if (!selectedCommentId) return;
                const token = localStorage.getItem('authToken');
                try {
                    const res = await fetch(`${API_BASE_URL}/api/comments/${selectedCommentId}`, {
                        method: 'DELETE',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (res.ok) {
                        closeDeleteModal();
                        loadMyComments();
                    }
                } catch (err) { console.error(err); }
            });

            window.addEventListener('DOMContentLoaded', loadMyComments);
        </script>
    </body>
</html>
