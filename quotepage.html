<!DOCTYPE html>
<html>
    <head>
        <title>Quote Detail - SYQ</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="favicon-16x16.png">
        <style>
            body { margin: 0; padding: 15px; font-family: 'Times New Roman', Times, serif; background-color: #fafafa; }
            #header-container { display: flex; align-items: center; justify-content: space-between; font-family: 'Times New Roman', Times, serif; gap: 15px; margin: 0 auto; }
            .logo-title-box { display: flex; align-items: center; gap: 15px; }
            #logo { width: 50px; height: auto; }
            #header-link { text-decoration: none; color: black; }
            #header-link h1 { margin: 0; font-size: 26px; }
            #setting { width: 28px; height: 28px; cursor: pointer; }
            hr { margin: 15px auto; border: 0; border-top: 1px solid #ddd; }
            #quo { border: 0.5px solid black; padding: 15px; background-color: rgba(231, 231, 232, 0.353); margin-top: 20px; border-radius: 8px; word-break: break-word; }
            #profilo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
            #profbox { display: flex; gap: 10px; align-items: center; cursor: pointer; }
            #profbox p { margin: 0; font-size: 16px; font-weight: bold; }
            .timestamp { font-size: 12px; color: #777; margin-left: 6px; font-weight: normal; }
            #tob { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
            #heart, #rep, #com, .delete-btn { width: 17px; height: 17px; cursor: pointer; }
            #icons { gap: 15px; display: flex; align-items: center; }
            .icon-wrapper { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: bold; }
            #comm { font-size: 25px; margin-top: 30px; }
            .comment-box { border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; word-break: break-word; }
            .comment-user-info { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; flex: 1; }
            .comment-input-area { margin-top: 20px; display: flex; gap: 10px; }
            .comment-input-area input { flex: 1; padding: 8px; font-family: 'Times New Roman', Times, serif; box-sizing: border-box; }
            .comment-input-area button { padding: 8px 16px; cursor: pointer; font-family: 'Times New Roman', Times, serif; flex-shrink: 0; }
            .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000; }
            .popup-box { border-style: solid; padding: 25px; width: 80%; max-width: 280px; text-align: center; border-radius: 8px; border-width: 2px; background-color: rgb(249, 249, 249); font-family: 'Times New Roman', Times, serif; box-sizing: border-box; }
            .popup-box p { margin-top: 0; margin-bottom: 20px; font-size: 16px; }
            .btn-group { display: flex; justify-content: center; gap: 20px; text-align: center; }
            .tik { background-color: rgb(243, 243, 243); border-radius: 4px; border-width: 0.5px; cursor: pointer; padding: 5px 15px; font-family: 'Times New Roman', Times, serif; }
            .tik:hover { background-color: rgb(222, 222, 222); }

            @media (max-width: 600px) {
                #header-link h1 { font-size: 20px; }
                #comm { font-size: 20px; }
            }
        </style>
    </head>
    <body>
        <div id="page">
            <div id="header-container">
                <div class="logo-title-box">
                    <a href="mainPage.html"><img id="logo" src="quote-icon-logo-design-template-vector.webp" alt="Logo"></a>
                    <a id="header-link" href="mainPage.html"><h1>Share Your Quotes</h1></a>
                </div>
                <a href="settingpage.html"><img id="setting" src="settings.png" alt="Settings"></a>
            </div>
            <hr>
        </div>

        <div id="quo">
            <p id="quoteContent" style="font-size: 18px; margin: 0;">Loading...</p>
            <div id="tob">
                <div id="profbox">
                    <img id="profilo" src="pngwing.com.png">
                    <b><p id="quoteAuthor">Username <span id="quoteTimestamp" class="timestamp"></span></p></b> 
                </div> 
                <div id="icons">
                    <div class="icon-wrapper">
                        <img id="heart" src="heart.png" onclick="toggleLike()">
                        <span id="likesCount">0</span>
                    </div>
                    <div class="icon-wrapper">
                        <img id="rep" src="repost.png" onclick="toggleRepost()">
                        <span id="repostsCount">0</span>
                    </div>
                    <div class="icon-wrapper">
                        <img id="com" src="comment.png">
                        <span id="commentsCountHeader">0</span>
                    </div>
                    <span id="postDeleteIconContainer"></span>
                </div>
            </div> 
        </div>

        <h3 id="comm">COMMENTS</h3>
        <hr>

        <div class="comment-input-area">
            <input type="text" id="commentText" placeholder="Write a comment...">
            <button id="sendCommentBtn">Post Comment</button>
        </div>

        <div id="commentsList" style="margin-top: 20px;"></div>

        <div id="deleteConfirmModal" class="modal-overlay">
            <div class="popup-box">
                <p id="deleteModalText">Do you want to delete this?</p>
                <div class="btn-group">
                    <button id="deleteConfirmBtn" class="tik">Yes</button>
                    <button class="tik" onclick="closeDeleteModal()">No</button>
                </div>
            </div>
        </div>

        <script>
            const API_BASE_URL = 'https://share-your-quotes.onrender.com';
            const urlParams = new URLSearchParams(window.location.search);
            const quoteId = urlParams.get('quoteId');

            let itemToDeleteId = null;
            let itemToDeleteType = null;

            function formatTimestamp(dateString) {
                if (!dateString) return '';
                const date = new Date(dateString);
                const now = new Date();
                const diffInSeconds = Math.floor((now - date) / 1000);

                if (diffInSeconds < 60) return 'Just now';
                if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}m ago`;
                if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}h ago`;
                if (diffInSeconds < 604800) return `${Math.floor(diffInSeconds / 86400)}d ago`;

                return date.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            function getLoggedInUser() {
                const userString = localStorage.getItem('currentUser');
                if (!userString || userString === 'undefined' || userString === 'null') return null;
                try {
                    const user = JSON.parse(userString);
                    return (user && user.id) ? user : null;
                } catch (e) { return null; }
            }

            function openDeleteModal(type, id) {
                itemToDeleteType = type;
                itemToDeleteId = id;
                const modalText = document.getElementById('deleteModalText');
                if (type === 'post') modalText.innerText = 'Do you want to delete this post?';
                else if (type === 'comment') modalText.innerText = 'Do you want to delete this comment?';
                document.getElementById('deleteConfirmModal').style.display = 'flex';
            }

            function closeDeleteModal() {
                itemToDeleteType = null; itemToDeleteId = null;
                document.getElementById('deleteConfirmModal').style.display = 'none';
            }

            document.getElementById('deleteConfirmBtn').addEventListener('click', async () => {
                if (!itemToDeleteId || !itemToDeleteType) return;
                const token = localStorage.getItem('authToken');

                try {
                    if (itemToDeleteType === 'post') {
                        const res = await fetch(`${API_BASE_URL}/api/quotes/${itemToDeleteId}`, {
                            method: 'DELETE', 
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}` 
                            }
                        });
                        if (res.ok) { closeDeleteModal(); window.location.href = 'mainPage.html'; }
                    } else if (itemToDeleteType === 'comment') {
                        const res = await fetch(`${API_BASE_URL}/api/comments/${itemToDeleteId}`, {
                            method: 'DELETE', 
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}` 
                            }
                        });
                        if (res.ok) { closeDeleteModal(); loadQuoteAndComments(); }
                    }
                } catch (err) { console.error('Delete error:', err); }
            });

            async function loadQuoteAndComments() {
                if (!quoteId) return;
                const currentUser = getLoggedInUser();
                const currentUserId = currentUser ? currentUser.id : 0;
                let userRole = 'user';

                if (currentUserId) {
                    try {
                        const userRes = await fetch(`${API_BASE_URL}/api/users/${currentUserId}`);
                        if (userRes.ok) { 
                            const dbUserData = await userRes.json(); 
                            const dbUser = dbUserData.user || dbUserData;
                            userRole = dbUser.role; 
                        }
                    } catch(err) { console.error('Role check error:', err); }
                }

                const isAuthorized = ['admin', 'moderator', 'editor'].includes(userRole);

                try {
                    const res = await fetch(`${API_BASE_URL}/api/quotes/${quoteId}`);
                    const data = await res.json();

                    document.getElementById('quoteContent').innerText = data.quote.content;
                    document.getElementById('quoteAuthor').innerHTML = `${data.quote.username} <span id="quoteTimestamp" class="timestamp">• ${formatTimestamp(data.quote.created_at)}</span>`;
                    if(data.quote.profile_pic) document.getElementById('profilo').src = data.quote.profile_pic;

                    document.getElementById('likesCount').innerText = data.quote.likes_count || 0;
                    document.getElementById('repostsCount').innerText = data.quote.reposts_count || 0;
                    document.getElementById('commentsCountHeader').innerText = data.comments.length || 0;
                    
                    document.getElementById('comm').innerText = `COMMENTS (${data.comments.length})`;

                    document.getElementById('profbox').onclick = () => { window.location.href = `accountpage.html?userId=${data.quote.user_id}`; };

                    const deleteContainer = document.getElementById('postDeleteIconContainer');
                    if (isAuthorized) {
                        deleteContainer.innerHTML = `<img class="delete-btn" src="delete.png" alt="Delete Quote" title="Delete Quote" onclick="openDeleteModal('post', ${data.quote.id})">`;
                    } else deleteContainer.innerHTML = '';

                    if (currentUserId) {
                        const checkRes = await fetch(`${API_BASE_URL}/api/quotes?userId=${currentUserId}`);
                        const allQuotes = await checkRes.json();
                        if (Array.isArray(allQuotes)) {
                            const found = allQuotes.find(item => item.id == quoteId);
                            if (found) {
                                document.getElementById('heart').src = found.is_liked ? 'heart2.png' : 'heart.png';
                                document.getElementById('rep').style.filter = found.is_reposted ? 'invert(48%) sepia(79%) saturate(417%) hue-rotate(86deg) brightness(98%) contrast(92%)' : 'none';
                            }
                        }
                    }

                    const list = document.getElementById('commentsList');
                    list.innerHTML = '';

                    if (data.comments && data.comments.length > 0) {
                        data.comments.forEach(c => {
                            const commentTrashHtml = isAuthorized ? `<img class="delete-btn" src="delete.png" alt="Delete Comment" title="Delete Comment" onclick="openDeleteModal('comment', ${c.id})">` : '';
                            list.innerHTML += `
                                <div class="comment-box">
                                    <div class="comment-user-info" onclick="window.location.href='accountpage.html?userId=${c.user_id}'">
                                        <img src="${c.profile_pic || 'pngwing.com.png'}" style="width: 25px; height: 25px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
                                        <div>
                                            <b>${c.username} <span class="timestamp">• ${formatTimestamp(c.created_at)}</span></b>
                                            <p style="margin: 5px 0 0 0;">${c.content}</p>
                                        </div>
                                    </div>
                                    ${commentTrashHtml}
                                </div>
                            `;
                        });
                    } else {
                        list.innerHTML = '<p style="font-style: italic; color: #666;">No comments yet.</p>';
                    }
                } catch(err) { console.error('Error loading quote/comments:', err); }
            }

            async function toggleLike() {
                const currentUser = getLoggedInUser();
                const token = localStorage.getItem('authToken');
                if (!currentUser || !token) return alert('First log in to your account!');

                try {
                    await fetch(`${API_BASE_URL}/api/quotes/${quoteId}/like`, { 
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}` 
                        }
                    });
                    loadQuoteAndComments();
                } catch (err) { console.error(err); }
            }

            async function toggleRepost() {
                const currentUser = getLoggedInUser();
                const token = localStorage.getItem('authToken');
                if (!currentUser || !token) return alert('First log in to your account!');

                try {
                    await fetch(`${API_BASE_URL}/api/quotes/${quoteId}/repost`, { 
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}` 
                        }
                    });
                    loadQuoteAndComments();
                } catch (err) { console.error(err); }
            }

            document.getElementById('sendCommentBtn').addEventListener('click', async () => {
                const currentUser = getLoggedInUser();
                const token = localStorage.getItem('authToken');
                if (!currentUser || !token) return alert('First log in to your account!');

                const text = document.getElementById('commentText').value;
                if (!text.trim()) return;

                try {
                    const res = await fetch(`${API_BASE_URL}/api/quotes/${quoteId}/comments`, { 
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }, 
                        body: JSON.stringify({ content: text }) 
                    });
                    if (res.ok) { 
                        document.getElementById('commentText').value = ''; 
                        loadQuoteAndComments(); 
                    } else {
                        const data = await res.json();
                        alert(data.error || 'Comment posting failed.');
                    }
                } catch(err) { console.error(err); }
            });

            window.addEventListener('DOMContentLoaded', loadQuoteAndComments);
        </script>
    </body>
</html>
