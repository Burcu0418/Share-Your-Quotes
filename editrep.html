<!DOCTYPE html>
<html>
    <head>
        <title>Edit Reposts - SYQ</title>
        <style>
            body { margin: 0; padding: 15px; font-family: 'Times New Roman', Times, serif; background-color: #fafafa; }
            .item-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; background-color: #f9f9f9; }
            .trash-icon { width: 22px; height: 22px; cursor: pointer; }
            .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000; }
            .popup-box { border-style: solid; padding: 25px; width: 220px; text-align: center; border-radius: 8px; border-width: 2px; background-color: rgb(249, 249, 249); font-family: 'Times New Roman', Times, serif; }
            .popup-box p { margin-top: 0; margin-bottom: 20px; font-size: 16px; }
            .btn-group { display: flex; justify-content: center; gap: 30px; text-align: center; }
            .tik { background-color: rgb(243, 243, 243); border-radius: 4px; border-width: 0.5px; cursor: pointer; padding: 5px 15px; font-family: 'Times New Roman', Times, serif; }
            .tik:hover { background-color: rgb(222, 222, 222); }
        </style>
    </head>
    <body>
        <h1>EDIT MY REPOSTS</h1>
        <hr><br>
        <div id="listContainer"></div>

        <div id="deleteConfirmModal" class="modal-overlay">
            <div class="popup-box">
                <p>Do you want to remove this repost?</p>
                <div class="btn-group">
                    <button id="confirmDeleteBtn" class="tik">Yes</button>
                    <button class="tik" onclick="closeDeleteModal()">No</button>
                </div>
            </div>
        </div>

        <script>
            const API_BASE_URL = 'http://localhost:3000';
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            let selectedQuoteId = null;

            async function loadMyReposts() {
                if (!currentUser) return;
                try {
                    const res = await fetch(`${API_BASE_URL}/api/user-reposts/${currentUser.id}`);
                    const reposts = await res.json();
                    const container = document.getElementById('listContainer');
                    container.innerHTML = '';

                    if (!reposts || reposts.length === 0) { container.innerHTML = '<p>Repost a quote first.</p>'; return; }

                    reposts.forEach(q => {
                        container.innerHTML += `
                            <div class="item-card">
                                <div>
                                    <p style="margin:0; font-size: 18px;">${q.content}</p>
                                    <small style="color: #666;">Posted by ${q.username}</small>
                                </div>
                                <img class="trash-icon" src="delete.png" alt="Delete" title="Remove Repost" onclick="openDeleteModal(${q.id})">
                            </div>
                        `;
                    });
                } catch (err) { console.error(err); }
            }

            function openDeleteModal(quoteId) {
                selectedQuoteId = quoteId;
                document.getElementById('deleteConfirmModal').style.display = 'flex';
            }

            function closeDeleteModal() {
                selectedQuoteId = null;
                document.getElementById('deleteConfirmModal').style.display = 'none';
            }

            document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
                if (!selectedQuoteId) return;
                const token = localStorage.getItem('authToken');
                try {
                    const res = await fetch(`${API_BASE_URL}/api/reposts/${selectedQuoteId}`, {
                        method: 'DELETE',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (res.ok) {
                        closeDeleteModal();
                        loadMyReposts();
                    }
                } catch (err) { console.error(err); }
            });

            window.addEventListener('DOMContentLoaded', loadMyReposts);
        </script>
    </body>
</html>
