<!DOCTYPE html>
<html>
    <head>
        <style>
            #fo{
                border-style: solid;
                padding: 40px;
                border-width: 1px;
                border-radius: 10px;
                background-color: rgb(249, 249, 249);

            }

        </style>

    </head>
    <body>
        <table id="fo">

        <form>
            <tr>
                <td>Username:</td> 
                <td><input type="text" id="usn"></td>
              
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="mail" id="mail"></td>
            </tr> 
            <tr>
                <td>Password:</td>
                <td><input type="password" id="pass"></td>
            </tr> 
    
            <tr>
                <td><input type="submit" id="sub"></td>
                <td><input type="reset" id="res"></td>
            </tr>
        </form>
    </table>

    </body>
</html>
