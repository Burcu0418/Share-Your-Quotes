<!DOCTYPE html>
<html>
    <head>
       <style>
        #page{
            border-style: solid;
            padding: 25px;
            width: 200px;
            text-align: center;
            border-radius: 8px;
            border-width: 2px;
            background-color: rgb(249, 249, 249);
            
        }
        #but{
            display: flex;
            justify-content: center;
            gap: 30px;
            
            text-align: center;
        }
        .tik{
            background-color: rgb(243, 243, 243);
            border-radius: 4px;
            border-width: 0.5px;
            cursor: pointer;
        }
        .tik:hover{
            background-color: rgb(222, 222, 222);
        }
        

       </style>
    </head> 
    
    <body>
        <div id="page">
            <p>Do you want to sign out?</p>
            <div id="but">
        <button id="y" class="tik">Yes</button>
        <button id="no" class="tik">No</button>
   </div> 
</div>
    </body>
</html>
